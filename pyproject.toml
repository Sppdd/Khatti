[project]
name = "khatti"
version = "0.3.0"
description = "Khatti — Arabic-first KYC document agent that knows when to hand over"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
    "hijridate>=2.3",
    "cryptography>=42",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Synthetic data, eval, calibration and bake-off jobs (jobs/). MLflow logging is used when installed.
jobs = ["playwright==1.56.0", "mlflow>=2.14"]
# Nebius Serverless deploys (deploy/nebius_deploy.py)
deploy = ["nebius==0.6.14"]
# NVIDIA NeMo Agent Toolkit: nat eval / nat serve over the pipeline (khatti/nat_plugin.py)
nat = ["nvidia-nat==1.9.0", "nvidia-nat-eval[full]==1.9.0", "nvidia-nat-profiler==1.9.0", "langchain-core>=0.3"]

[project.entry-points."nat.components"]
khatti = "khatti.nat_plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khatti*", "jobs*", "deploy*"]

[tool.setuptools.package-data]
khatti = ["rules/*.yaml", "store/*.sql"]
"jobs.synth" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
