[project]
name = "khatti"
version = "0.3.0"
description = "Khatti — Arabic-first KYC document agent that knows when to hand over"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.2",
    "boto3>=1.34",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
    "hijridate>=2.3",
    "cryptography>=42",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khatti*"]

[tool.setuptools.package-data]
khatti = ["rules/*.yaml", "store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
